server {
    listen 80;
    server_name _;

    # ── React SPA ──────────────────────────────────────────────────────────
    # Serve static files from the Vite build output.
    # Unmatched paths fall back to index.html so client-side routing works.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Serve the Vite SPA. Unmatched paths fall back to index.html so
        # client-side routing works on deep links/refresh.
        try_files $uri $uri/ /index.html;

        # index.html must never be cached: it references content-hashed assets,
        # so a stale index.html (or stale referenced bundle) is what causes
        # "404 / route not found" after a deploy. Fingerprinted assets are
        # cached separately (see the assets location below) and are immutable.
        add_header Cache-Control "no-cache, must-revalidate, no-store" always;
    }

    # ── API reverse proxy ──────────────────────────────────────────────────
    # Forward all /api/* requests to the Express server running on port 5000.
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow larger request bodies (e.g. image uploads)
        client_max_body_size 20m;

        # Session cookies require credentials forwarding
        proxy_pass_header Set-Cookie;
    }

    # ── Static asset caching ───────────────────────────────────────────────
    # Vite fingerprints JS/CSS/image filenames; cache them aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
}
