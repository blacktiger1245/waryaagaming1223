kind = "web"
previewPath = "/"
title = "Waryaa Gaming"
version = "1.0.0"
id = "artifacts/wg-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25274

[services.development]
run = "pnpm --filter @workspace/wg-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wg-platform", "run", "build" ]
publicDir = "artifacts/wg-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25274"
BASE_PATH = "/"
